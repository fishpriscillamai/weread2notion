name: debug weread progress

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect progress response
        shell: bash
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import requests

          url = "https://i.weread.qq.com/api/agent/gateway"
          headers = {
              "Authorization": f"Bearer {os.environ['WEREAD_API_KEY']}",
              "Content-Type": "application/json",
          }
          book_ids = ["3300020525", "3300157981"]
          candidate_names = [
              "recordReadingTime",
              "readingTime",
              "totalReadingTime",
              "readTime",
              "bookReadTime",
              "wrReadingTime",
          ]

          for book_id in book_ids:
              payload = {
                  "api_name": "/book/getprogress",
                  "skill_version": "1.0.5",
                  "bookId": book_id,
              }
              data = requests.post(url, headers=headers, json=payload, timeout=30).json()
              book = data.get("book") or {}
              print(f"bookId={book_id}")
              print("top_keys=", sorted(data.keys()))
              print("book_keys=", sorted(book.keys()))
              print("top_candidates=", {name: data.get(name) for name in candidate_names if name in data})
              print("book_candidates=", {name: book.get(name) for name in candidate_names if name in book})
              print("progress=", book.get("progress"), "finishTime=", book.get("finishTime"), "updateTime=", book.get("updateTime"))
          PY
